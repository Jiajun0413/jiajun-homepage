[workspace]
channels = ["https://mirrors.nju.edu.cn/anaconda/cloud/conda-forge/"]
name = "jiajun-homepage"
platforms = ["linux-64"]
version = "0.1.0"

[target.unix.activation.env]
# dx uses only PATH tools; no runtime downloads (esbuild/wasm-opt/tailwind)
NO_DOWNLOADS = "1"
PATH = "$PIXI_PROJECT_ROOT/web/node_modules/.bin:$PATH"

[tasks]
install-web-tools = { cmd = "cargo install dioxus-cli --version 0.7.10 --locked && cargo install wasm-bindgen-cli --version 0.2.130 --locked && npm ci --prefix web --no-fund --no-audit --registry=https://registry.npmmirror.com" }
web-check = { cwd = "web", cmd = "cargo check --no-default-features --features server && cargo check --no-default-features --features web --target wasm32-unknown-unknown" }
web-test = { cwd = "web", cmd = "cargo test --no-default-features --features server" }
test = { depends-on = ["web-test"] }
web-dev = { cwd = "web", cmd = "dx serve --fullstack true" }
# Compile CSS with the installed CLI first, then a single dx bundle, then prune stale hashed assets.
web-build = { cwd = "web", cmd = "node_modules/.bin/tailwindcss -i tailwind.css -o assets/tailwind.css --minify && dx bundle --release --out-dir dist && bash prune-dist.sh" }
web-clean = { cmd = "rm -rf web/dist web/target web/assets/tailwind.css web/node_modules" }
web-serve = { cmd = "web/dist/server" }

[dependencies]
binaryen = ">=121,<122"  # wasm-opt on PATH for dx
esbuild = ">=0.28.1,<0.29"  # JS bundler on PATH for dx
nodejs = ">=22,<23"
