[workspace]
channels = ["https://mirrors.nju.edu.cn/anaconda/cloud/conda-forge/"]
name = "jiajun-homepage"
platforms = ["linux-64"]
version = "0.1.0"

[target.unix.activation.env]
# dx bundles JS and wasm itself; esbuild/wasm-opt come from the pixi environment
NO_DOWNLOADS = "1"

[tasks]
install-web-tools = { cmd = "cargo install dioxus-cli --version 0.7.10 --locked && cargo install wasm-bindgen-cli --version 0.2.130 --locked" }
web-check = { cwd = "web", cmd = "cargo check --no-default-features --features server && cargo check --no-default-features --features web --target wasm32-unknown-unknown" }
web-test = { cwd = "web", cmd = "cargo test --no-default-features --features server" }
test = { depends-on = ["web-test"] }
web-dev = { cwd = "web", cmd = "dx serve --fullstack true" }
# Fresh dist and dx staging per build; cargo target caches stay intact.
web-build = { cwd = "web", cmd = "rm -rf dist target/dx && dx bundle --release --out-dir dist" }
web-clean = { cmd = "rm -rf web/dist web/target" }
web-serve = { cmd = "web/dist/server" }

# Stop, rebuild, then start only when the build succeeds.
deploy = { cmd = "systemctl --user stop jiajun-homepage.service && pixi run web-build && systemctl --user start jiajun-homepage.service" }
start = { cmd = "systemctl --user start jiajun-homepage.service pdf2zh.service jiajun-homepage-tunnel.service" }
stop = { cmd = "systemctl --user stop jiajun-homepage.service pdf2zh.service jiajun-homepage-tunnel.service" }
status = { cmd = "systemctl --user status jiajun-homepage.service pdf2zh.service jiajun-homepage-tunnel.service --no-pager" }
# Units carry concrete paths; a plain file install keeps them in sync with the repo.
install-services = { cmd = "mkdir -p \"$HOME/.config/systemd/user\" && install -m 644 deploy/systemd/*.service \"$HOME/.config/systemd/user/\" && systemctl --user daemon-reload && systemctl --user enable jiajun-homepage.service pdf2zh.service jiajun-homepage-tunnel.service && loginctl enable-linger \"$USER\"" }

[dependencies]
binaryen = ">=121,<122"  # wasm-opt on PATH for dx
esbuild = ">=0.28.1,<0.29"  # JS bundler on PATH for dx
