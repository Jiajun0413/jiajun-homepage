[package]
name = "jiajun-homepage"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router", "cli-config"] }
serde = { version = "1", features = ["derive"] }

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.dioxus-server]
version = "0.7.10"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "signal", "net", "macros"]
optional = true

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[features]
default = ["web"]
ssr = ["dep:axum", "dep:dioxus-server", "dep:tokio"]
server = ["dioxus/server", "ssr"]
web = ["dioxus/web"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
